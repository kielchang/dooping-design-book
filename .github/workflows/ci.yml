name: CI

# dev 的把關與預覽站。
#
# 分支模型：dev 做開發與確認，確認過才併進 main；main 是其他系統參照的規範正本。
# 這支只驗證與部署預覽站，**不碰 npm**——發佈只有 publish-tokens.yml 那條路。
#
# 刻意做成單一 job：驗證與預覽用同一次建置。拆成兩個 job 會讓文件站建置跑兩次、
# book/ 跑兩次 npm ci，多花一兩分鐘卻換不到東西（onBrokenLinks 的檢查與 baseUrl 無關）。
# 這個 repo 是主導整體開發的介面框架，看到 UI 的速度本身就是功能的一部分。
#
# 預覽站 https://kielchang.github.io/dooping-design-book/preview/ 隨時會被下一次
# dev push 覆蓋，**不是進版**，其他系統一律不得參照。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: write # 推 gh-pages 分支的 preview/

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci
      - name: 建置 token（CSS 產物是後續所有步驟的前提）
        run: npm run build:tokens
      - name: 型別檢查
        run: npm run typecheck
      - name: 守衛測試（元件庫邊界、token 一致性、去領域化詞彙）
        run: npm test

      # registry/*.json 是進版控的產物。改了 packages/react/src 卻沒重跑產生器，
      # 線上 registry 就會跟原始碼對不起來——這裡當場擋下來。
      - name: registry 與原始碼一致
        run: |
          npm run build:registry
          git diff --exit-code -- registry/ || {
            echo "::error::registry/ 與原始碼不同步。請執行 npm run build:registry 並提交結果。"
            exit 1
          }

      # 「什麼時候該發 npm」的規則是：tokens.json 的內容有變才發。
      # 這一步讓那條規則變成會擋人的檢查，而不是要記得的事。
      - name: token 內容變更必須伴隨版號 bump
        run: |
          git fetch --depth=1 origin main || exit 0
          git cat-file -e origin/main:packages/tokens/src/tokens.json 2>/dev/null || exit 0
          OLD=$(git show origin/main:packages/tokens/src/tokens.json)
          NEW=$(cat packages/tokens/src/tokens.json)
          if [ "$(jq -S 'del(.meta)' <<<"$OLD")" != "$(jq -S 'del(.meta)' <<<"$NEW")" ] \
             && [ "$(jq -r .meta.version <<<"$OLD")" = "$(jq -r .meta.version <<<"$NEW")" ]; then
            echo "::error::tokens.json 的內容相對 main 有變，但版號還停在 $(jq -r .meta.version <<<"$NEW")。請同步 bump 三處版號（tokens/package.json、tokens.json 的 meta.version、react/package.json 的相依）並補一則 CHANGELOG。"
            exit 1
          fi

      # 規範版號（root package.json → vX.Y.Z tag ＋ registry 戳記）是給取用端的訊號：
      # 元件或 token 有消費端可感知的變更，就必須伴隨版號 bump，否則取用端看不到訊號。
      # 純文件變更不強制——那本來就不該 bump。大中小的判準見治理章「版本策略」。
      - name: 規範內容變更必須伴隨規範版號 bump
        run: |
          git fetch --depth=1 origin main || exit 0
          git rev-parse -q --verify origin/main >/dev/null || exit 0
          OLD_VER=$(git show origin/main:package.json | jq -r .version)
          NEW_VER=$(jq -r .version package.json)
          # 監看清單＝取用端踩得到的介面。tailwind-preset 與 templates/ 同樣是
          # 取用端會複製或 require 的東西，漏掉它們等於版號訊號有破口。
          CHANGED=$(git diff --name-only origin/main HEAD -- \
            packages/react/src \
            packages/tokens/src/tokens.json \
            packages/tokens/tailwind-preset.cjs \
            packages/tokens/scripts \
            templates)
          if [ -n "$CHANGED" ] && [ "$OLD_VER" = "$NEW_VER" ]; then
            echo "::error::元件或 token 相對 main 有變，但規範版號還停在 $NEW_VER。請依大中小判準 bump 根目錄 package.json 的 version（並同步 react/package.json 與 version.ts、重跑 npm run build:registry），在 CHANGELOG 寫明理由。變更檔案：$(echo "$CHANGED" | tr '\n' ' ')"
            exit 1
          fi

      - name: 產生 registry JSON（base 指向正式站，預覽站不供安裝）
        run: node scripts/build-registry.mjs
        env:
          REGISTRY_BASE: https://kielchang.github.io/dooping-design-book

      - name: "建置文件站（baseUrl 指向 /preview/）"
        working-directory: book
        run: |
          npm ci
          npm run build
        env:
          BOOK_BASE_URL: /dooping-design-book/preview/
          BOOK_SITE_URL: https://kielchang.github.io

      - name: 建置 Storybook → /preview/storybook
        run: npm run build-storybook -- -o book/build/storybook

      - name: 放置 registry → /preview/r
        run: |
          mkdir -p book/build/r
          cp registry/*.json book/build/r/

      # PR 只驗證不部署——預覽站是 dev 的，不該被 PR 覆蓋。
      - name: "發佈預覽站 → gh-pages:preview/"
        if: github.event_name == 'push'
        run: |
          bash scripts/deploy-gh-pages.sh book/build preview "deploy(preview) ${{ github.sha }}"
          echo "### 📱 預覽站 https://kielchang.github.io/dooping-design-book/preview/" >> "$GITHUB_STEP_SUMMARY"
