name: CI

# dev 的把關與預覽站。
#
# 分支模型：dev 做開發與確認，確認過才併進 main；main 是其他系統參照的規範正本。
# 這支只驗證與部署預覽站，**不碰 npm**——發佈只有 publish-tokens.yml 那條路。
#
# 刻意做成單一 job：驗證與預覽用同一次建置。拆成兩個 job 會讓文件站建置跑兩次、
# book/ 跑兩次 npm ci，多花一兩分鐘卻換不到東西（onBrokenLinks 的檢查與 baseUrl 無關）。
# 這個 repo 是主導整體開發的介面框架，看到 UI 的速度本身就是功能的一部分。
#
# 預覽站 https://kielchang.github.io/dooping-design-book/preview/ 隨時會被下一次
# dev push 覆蓋，**不是進版**，其他系統一律不得參照。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: write # 推 gh-pages 分支的 preview/

# 這個 group 的用途是**序列化 gh-pages 的寫入**：deploy.yml（寫根目錄）與本檔的
# dev push（寫 preview/）寫的是同一個分支的不同子目錄，共用一個 group 才不會互相覆蓋。
#
# 但 PR 的那一輪**不寫 gh-pages**（下方部署步驟的 if 已經排除它）。
# 把不寫入的 run 放進寫入者的佇列，會踩到 GitHub 的一條行為：
# 同一個 group 只保留一個 pending run，新的排進來就把舊的取消掉。
#
# 實際發生過（合併 main、推 dev、開 PR 擠在一分鐘內）：
#
#   08:53 deploy.yml(main) 開始 ── 佔住 group
#   08:54 ci.yml(push dev)  排隊
#   08:55 ci.yml(PR)        排隊 ── 把排隊中的 push 那輪取消掉
#
# push 那輪是唯一會部署預覽站的，於是預覽站安靜地停在上一版：
# 沒有失敗、沒有紅燈，只是維護者在手機上看到的還是舊的。
#
# 所以 PR 用自己的 group——它不寫 gh-pages，本來就不該排在寫入佇列裡。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || 'gh-pages-write' }}
  cancel-in-progress: false

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci
      - name: 建置 token（CSS 產物是後續所有步驟的前提）
        run: npm run build:tokens
      - name: 型別檢查
        run: npm run typecheck
      - name: 守衛測試（元件庫邊界、token 一致性、去領域化詞彙）
        run: npm test

      # registry/*.json 是進版控的產物。改了 packages/react/src 卻沒重跑產生器，
      # 線上 registry 就會跟原始碼對不起來——這裡當場擋下來。
      - name: registry 與原始碼一致
        run: |
          npm run build:registry
          git diff --exit-code -- registry/ || {
            echo "::error::registry/ 與原始碼不同步。請執行 npm run build:registry 並提交結果。"
            exit 1
          }

      # 「什麼時候該發 npm」的規則是：tokens.json 的內容有變才發。
      # 這一步讓那條規則變成會擋人的檢查，而不是要記得的事。
      - name: token 內容變更必須伴隨版號 bump
        run: |
          git fetch --depth=1 origin main || exit 0
          git cat-file -e origin/main:packages/tokens/src/tokens.json 2>/dev/null || exit 0
          OLD=$(git show origin/main:packages/tokens/src/tokens.json)
          NEW=$(cat packages/tokens/src/tokens.json)
          if [ "$(jq -S 'del(.meta)' <<<"$OLD")" != "$(jq -S 'del(.meta)' <<<"$NEW")" ] \
             && [ "$(jq -r .meta.version <<<"$OLD")" = "$(jq -r .meta.version <<<"$NEW")" ]; then
            echo "::error::tokens.json 的內容相對 main 有變，但版號還停在 $(jq -r .meta.version <<<"$NEW")。請同步 bump 三處版號（tokens/package.json、tokens.json 的 meta.version、react/package.json 的相依）並補一則 CHANGELOG。"
            exit 1
          fi

      # 規範版號（root package.json → vX.Y.Z tag ＋ registry 戳記）是給取用端的訊號：
      # 元件或 token 有消費端可感知的變更，就必須伴隨版號 bump，否則取用端看不到訊號。
      # 純文件變更不強制——那本來就不該 bump。大中小的判準見治理章「版本策略」。
      - name: 規範內容變更必須伴隨規範版號 bump
        run: |
          git fetch --depth=1 origin main || exit 0
          git rev-parse -q --verify origin/main >/dev/null || exit 0
          OLD_VER=$(git show origin/main:package.json | jq -r .version)
          NEW_VER=$(jq -r .version package.json)
          # 監看清單＝取用端踩得到的介面。tailwind-preset 與 templates/ 同樣是
          # 取用端會複製或 require 的東西，漏掉它們等於版號訊號有破口。
          #
          # 反過來，下面這四類被 scripts/build-registry.mjs 明確跳過，不會進 registry——
          # 它們改了，取用端拿到的東西一個位元都沒變。監看範圍因此要**逐字等於**
          # 「會進 registry 的集合」：多一個是假警報，少一個是漏訊號。
          # 對照 scripts/build-registry.mjs 的 walk() 與 index.ts/version.ts/demo/ 跳過條件。
          CHANGED=$(git diff --name-only origin/main HEAD -- \
            packages/react/src \
            packages/tokens/src/tokens.json \
            packages/tokens/tailwind-preset.cjs \
            packages/tokens/scripts \
            templates \
            ':(exclude)packages/react/src/demo' \
            ':(exclude)packages/react/src/index.ts' \
            ':(exclude)packages/react/src/version.ts' \
            ':(exclude)*.stories.tsx')
          if [ -n "$CHANGED" ] && [ "$OLD_VER" = "$NEW_VER" ]; then
            echo "::error::元件或 token 相對 main 有變，但規範版號還停在 $NEW_VER。請依大中小判準 bump 根目錄 package.json 的 version（並同步 react/package.json 與 version.ts、重跑 npm run build:registry），在 CHANGELOG 寫明理由。變更檔案：$(echo "$CHANGED" | tr '\n' ' ')"
            exit 1
          fi

      # npm 上的 @dooping/tokens 落後 repo 宣告的版本時出聲。
      #
      # 這是 v0.6.0 那次的根因：元件開始吃 `--brand` 與 `.state-layer`，npm 上的 token
      # 卻還停在 0.1.2。取用端 `npx shadcn add` 抄完元件、裝到舊 token，畫面壞掉
      # 而且**不會報錯**——中間漂移了四個版本，沒有任何一道自動檢查提起過這件事。
      #
      # 刻意**只警告、不擋 PR**：正確的順序是「先把元件與版號合併進 main，
      # 再對 main 推 tokens-v* 觸發發佈」——publish-tokens.yml 吃的是 tag。
      # 擋下來會讓那個順序變成死結：PR 過不了就進不了 main，進不了 main 就發不了版。
      # 所以這一步只留 warning 與一段摘要，讓人看得到，而不是攔路。
      - name: "npm 上的 tokens 版本是否落後（僅警告，不擋 PR）"
        continue-on-error: true
        run: |
          DECLARED=$(jq -r '.dependencies["@dooping/tokens"] // empty' packages/react/package.json | sed 's/^[~^>=< ]*//')
          PUBLISHED=$(npm view @dooping/tokens version 2>/dev/null || true)

          {
            echo "### @dooping/tokens 散佈狀態"
            echo ""
            echo "| 來源 | 版本 |"
            echo "| --- | --- |"
            echo "| repo 宣告（packages/react） | \`${DECLARED:-查不到}\` |"
            echo "| npm 上的 latest | \`${PUBLISHED:-查不到}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$DECLARED" ] || [ -z "$PUBLISHED" ]; then
            echo "兩邊有一邊查不到版本，略過比對（不視為失敗）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$DECLARED" = "$PUBLISHED" ]; then
            echo "✅ 一致——取用端照 registry 裝得到對的 token。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          NEWER=$(printf '%s\n%s\n' "$DECLARED" "$PUBLISHED" | sort -V | tail -1)
          if [ "$NEWER" = "$DECLARED" ]; then
            echo "::warning::npm 上的 @dooping/tokens 是 $PUBLISHED，但 repo 宣告 $DECLARED。合併進 main 之後要推 tokens-v$DECLARED 這個 tag 才會發佈。"
            {
              echo "⚠️ **npm 落後。** 取用端照 registry 會裝到 \`$PUBLISHED\`，"
              echo "缺少 \`$DECLARED\` 才有的 token——元件會安靜地壞掉，不會報錯。"
              echo ""
              echo "合併進 \`main\` 之後發佈："
              echo ""
              echo '```bash'
              echo "git tag -a tokens-v$DECLARED -m \"tokens $DECLARED\" && git push origin tokens-v$DECLARED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::npm 上是 $PUBLISHED，比 repo 宣告的 $DECLARED 新——repo 這邊落後了。"
            {
              echo "⚠️ **repo 落後 npm**（npm \`$PUBLISHED\` 比宣告的 \`$DECLARED\` 新）。"
              echo "確認是不是有人繞過流水線手動發過版。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 產生 registry JSON（base 指向正式站，預覽站不供安裝）
        run: node scripts/build-registry.mjs
        env:
          REGISTRY_BASE: https://kielchang.github.io/dooping-design-book

      - name: "建置文件站（baseUrl 指向 /preview/）"
        working-directory: book
        run: |
          npm ci
          npm run build
        env:
          BOOK_BASE_URL: /dooping-design-book/preview/
          BOOK_SITE_URL: https://kielchang.github.io

      # 渲染守衛：對剛建好的 book/build 逐頁驗 computed style——
      # 表格只有列底線、按鈕沒有 UA 外框、portal 面板有基座。這是整條流水線裡
      # 唯一「看得見畫出來的結果」的檢查，其餘守衛都是靜態的（ADR-0008）。
      - name: 安裝 Playwright Chromium（渲染守衛用）
        run: npx playwright install --with-deps chromium
      - name: 渲染守衛：demo 宿主基座（verify:book）
        run: npm run verify:book
        env:
          BOOK_BASE_URL: /dooping-design-book/preview/

      - name: 建置 Storybook → /preview/storybook
        run: npm run build-storybook -- -o book/build/storybook

      - name: 放置 registry → /preview/r
        run: |
          mkdir -p book/build/r
          cp registry/*.json book/build/r/

      # PR 只驗證不部署——預覽站是 dev 的，不該被 PR 覆蓋。
      - name: "發佈預覽站 → gh-pages:preview/"
        if: github.event_name == 'push'
        run: |
          bash scripts/deploy-gh-pages.sh book/build preview "deploy(preview) ${{ github.sha }}"
          echo "### 📱 預覽站 https://kielchang.github.io/dooping-design-book/preview/" >> "$GITHUB_STEP_SUMMARY"
