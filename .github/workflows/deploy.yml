name: Deploy Design Book

# main＝其他系統參照的規範正本。這支把它發佈到 gh-pages 分支的根目錄：
#   /            → 文件站（Docusaurus）
#   /storybook/  → Storybook 活元件展示
#   /r/*.json    → shadcn registry（npx shadcn add <URL> 可安裝）
#
# gh-pages 上還有一個 /preview/，那是 dev 的預覽站（由 ci.yml 部署）。
# 這支只動根目錄、絕不碰 preview/，反之亦然——邊界寫在 scripts/deploy-gh-pages.sh。
# 兩支共用 concurrency group「gh-pages-write」序列化寫入，避免同時 push 互撞。
#
# 三個產物互相依賴（文件站與 Storybook 都吃元件原始碼、registry 由原始碼產生），
# 所以刻意放在同一個 job 依序建置，避免版本不一致。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 推 gh-pages 分支

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci
      - name: 建置 token（CSS 產物是後續所有步驟的前提）
        run: npm run build:tokens
      - name: 型別檢查
        run: npm run typecheck
      - name: 守衛測試（元件庫邊界、token 一致性、去領域化詞彙）
        run: npm test

      - name: 產生 registry JSON（base 指向正式站）
        run: node scripts/build-registry.mjs
        env:
          REGISTRY_BASE: https://kielchang.github.io/dooping-design-book

      - name: 建置文件站
        working-directory: book
        run: |
          npm ci
          npm run build
        env:
          BOOK_BASE_URL: /dooping-design-book/
          BOOK_SITE_URL: https://kielchang.github.io

      - name: 建置 Storybook → /storybook
        run: npm run build-storybook -- -o book/build/storybook

      - name: 放置 registry → /r
        run: |
          mkdir -p book/build/r
          cp registry/*.json book/build/r/

      - name: 發佈到 gh-pages 根目錄（保留 preview/）
        run: |
          bash scripts/deploy-gh-pages.sh book/build . "deploy(main) ${{ github.sha }}"

      # 進版 tag 是部署的「紀錄」，不是閘門——真正的閘門是 dev → main 的合併。
      # 放在發佈之後：部署失敗就不會有 tag，tag 永遠代表「真的上線過」。
      #
      # 這個 tag 不觸發任何東西：release-* 不符合 publish-tokens.yml 的 tokens-v*
      # glob，而且 GITHUB_TOKEN 建立的 ref 依 GitHub 防遞迴機制不會觸發其他
      # workflow——雙重保險。npm 發佈仍然只有人工的 tokens-v* 或 workflow_dispatch。
      - name: 蓋上進版 tag（release-YYYY-MM-DD）
        run: |
          git fetch --tags -q origin
          # 不用 grep -q：pipefail 下 -q 提早退出可能讓 git tag 吃 SIGPIPE，
          # 把「已有 tag」誤判成「沒有」。不加 -q 會讀完整個輸出，順便印出既有 tag。
          if git tag --points-at HEAD | grep '^release-'; then
            echo "此 commit 已有進版 tag，跳過（重跑不重複打）"
            exit 0
          fi
          BASE="release-$(TZ=Asia/Taipei date +%F)"
          TAG="$BASE"; N=2
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            TAG="$BASE-$N"; N=$((N+1))
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "進版 $TAG" -m "commit ${{ github.sha }}" \
            -m "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$TAG"
          echo "### 🏷 $TAG" >> "$GITHUB_STEP_SUMMARY"
