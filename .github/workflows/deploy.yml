name: Deploy Design Book

# main＝核准版，其他系統參照的正本。只收 staging → main 的核准合併（ruleset＋pr-gate）。
#   /            → 文件站（Docusaurus）
#   /storybook/  → Storybook
#   /r/*.json    → shadcn registry（npx shadcn add <URL> 可安裝）
# gh-pages 上還有 /preview/（dev，preview.yml）與 /staging/（候選版，staging.yml），這支只動根目錄、絕不碰它們——
# 邊界寫在 scripts/deploy-gh-pages.sh 的 STAGE_DIRS。
# 流程正本：book/docs/7-governance/01-versioning.mdx「三段式發布」。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 推 gh-pages 分支、蓋 v* tag

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  # 手動觸發可以選任何分支——對著 dev 或 staging 按下去，會把那個分支部署到正式站根目錄、還蓋上它的版號 tag。
  production-ref-guard:
    runs-on: ubuntu-latest
    steps:
      - name: 只能對 main 分支執行
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::deploy.yml 只能對 main 分支執行（收到 $GITHUB_REF）"
            exit 1
          fi

  production:
    needs: production-ref-guard
    uses: ./.github/workflows/_pipeline.yml
    with:
      stage: production
      deploy: true

  release:
    needs: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要讀上一個 v* tag 的 registry/ 來列 registry 異動
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      # 規範版號 tag（vX.Y.Z）——給取用端的訊號，不是部署紀錄。
      # 版號正本是根目錄 package.json 的 version：在 dev 依大中小判準 bump 並寫 CHANGELOG，
      # 候選版過了 staging 的套用驗收、守門人在 staging → main 的 PR 勾完核准清單合併，這裡才把版號蓋成 tag。
      # 版號沒動的進版（純文件／純 CI）不產生新 tag——取用端看不到新版號，就代表不需要動作。
      #
      # 這個 tag 不觸發任何東西：v* 不符合 publish-tokens.yml 的 tokens-v* 比對，
      # 而且 GITHUB_TOKEN 建立的 ref 依 GitHub 防遞迴機制不會觸發其他 workflow。
      - name: 蓋上規範版號 tag（vX.Y.Z）
        run: |
          git fetch --tags -q origin
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG 已存在——版號未變的進版（純文件／純 CI）或重跑，都不另打 tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tag 訊息帶上配對的 tokens 版本——「這一版規範配哪一版 token」可以直接從 git tag -n 稽核
          TOKENS_VER=$(node -p "require('./packages/react/package.json').dependencies['@dooping/tokens'].replace(/^[~^>=< ]*/, '')")
          git tag -a "$TAG" -m "進版 $TAG（$(TZ=Asia/Taipei date +%F)）" \
            -m "tokens 配對版：$TOKENS_VER" \
            -m "commit ${{ github.sha }}" \
            -m "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$TAG"
          echo "### 🏷 $TAG（tokens 配對版 $TOKENS_VER）" >> "$GITHUB_STEP_SUMMARY"

      # Release＝tag 的推播通道：取用端 Watch → Custom → Releases 就會收到新版通知。
      # 冪等：tag 已有 Release 就跳過；歷史 tag 缺 Release 的情況也會在這裡補上。
      # notes 直接抽 CHANGELOG 該則全文（scripts/lib/changelog.mjs，與 tests/changelog.test.ts 測的是同一段程式），
      # 抽不到才退回連結並出 warning。
      - name: 建立 GitHub Release（讓 Watch → Releases 通知生效）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags -q origin
          TAG="v$(node -p "require('./package.json').version")"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "沒有 $TAG 這個 tag（上一步要嘛打了 tag、要嘛 tag 已存在）"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在——純文件進版或重跑，不另發"
            exit 0
          fi
          node scripts/release-gate.mjs notes "$TAG" > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "::warning::CHANGELOG 找不到 $TAG 的段落——請回頭補查「開 dev → staging PR 前改名」步驟"
            echo "改了什麼、你需要做什麼：讀 [CHANGELOG](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md) 的 $TAG 一則。" > /tmp/release-notes.md
          fi
          # 附上這一版動到的 registry item（相對上一個 v* tag）：取用端看 Release 就知道自己抄的 item 有沒有被動到。
          if node scripts/registry-changes.mjs --before "$TAG" --markdown > /tmp/registry-changes.md 2> /tmp/registry-changes.err; then
            { echo ""; cat /tmp/registry-changes.md; } >> /tmp/release-notes.md
            cat /tmp/registry-changes.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::算不出 registry 異動清單（不擋發佈）：$(head -c 300 /tmp/registry-changes.err)"
          fi
          {
            echo ""
            echo "---"
            echo "判斷要不要跟進：[跟上新版](https://kielchang.github.io/dooping-design-book/governance/staying-current/)"
          } >> /tmp/release-notes.md
          TOKENS_VER=$(node -p "require('./packages/react/package.json').dependencies['@dooping/tokens'].replace(/^[~^>=< ]*/, '')")
          gh release create "$TAG" --verify-tag \
            --title "$TAG（tokens 配對版 $TOKENS_VER）" \
            --notes-file /tmp/release-notes.md
          echo "### 📣 Release $TAG 已發佈" >> "$GITHUB_STEP_SUMMARY"

      # 進版當下的配對狀態：「該去推 tokens-v* 了」最該被看見的時刻是核准版上線的這一刻。永遠 exit 0。
      - name: 配對狀態（宣告版 vs npm，僅提示）
        continue-on-error: true
        run: |
          DECLARED=$(node -p "require('./packages/react/package.json').dependencies['@dooping/tokens'].replace(/^[~^>=< ]*/, '')")
          PUBLISHED=$(npm view @dooping/tokens version 2>/dev/null || true)
          {
            echo "### @dooping/tokens 配對狀態"
            echo ""
            echo "| 宣告（本次進版） | npm latest |"
            echo "| --- | --- |"
            echo "| \`${DECLARED:-查不到}\` | \`${PUBLISHED:-查不到}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DECLARED" ] && [ -n "$PUBLISHED" ] && [ "$DECLARED" != "$PUBLISHED" ]; then
            echo "::warning::npm 上的 @dooping/tokens 是 $PUBLISHED，本次進版宣告 $DECLARED——請推 tokens-v$DECLARED 發佈。"
          fi
          exit 0
