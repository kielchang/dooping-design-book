name: Deploy Design Book

# main＝其他系統參照的規範正本。這支把它發佈到 gh-pages 分支的根目錄：
#   /            → 文件站（Docusaurus）
#   /storybook/  → Storybook 活元件展示
#   /r/*.json    → shadcn registry（npx shadcn add <URL> 可安裝）
#
# gh-pages 上還有一個 /preview/，那是 dev 的預覽站（由 ci.yml 部署）。
# 這支只動根目錄、絕不碰 preview/，反之亦然——邊界寫在 scripts/deploy-gh-pages.sh。
# 兩支共用 concurrency group「gh-pages-write」序列化寫入，避免同時 push 互撞。
#
# 三個產物互相依賴（文件站與 Storybook 都吃元件原始碼、registry 由原始碼產生），
# 所以刻意放在同一個 job 依序建置，避免版本不一致。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 推 gh-pages 分支

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci
      - name: 建置 token（CSS 產物是後續所有步驟的前提）
        run: npm run build:tokens
      - name: 型別檢查
        run: npm run typecheck
      - name: 守衛測試（元件庫邊界、token 一致性、去領域化詞彙）
        run: npm test

      - name: 產生 registry JSON（base 指向正式站）
        run: node scripts/build-registry.mjs
        env:
          REGISTRY_BASE: https://kielchang.github.io/dooping-design-book

      - name: 建置文件站
        working-directory: book
        run: |
          npm ci
          npm run build
        env:
          BOOK_BASE_URL: /dooping-design-book/
          BOOK_SITE_URL: https://kielchang.github.io

      - name: 建置 Storybook → /storybook
        run: npm run build-storybook -- -o book/build/storybook

      - name: 放置 registry → /r
        run: |
          mkdir -p book/build/r
          cp registry/*.json book/build/r/

      - name: 發佈到 gh-pages 根目錄（保留 preview/）
        run: |
          bash scripts/deploy-gh-pages.sh book/build . "deploy(main) ${{ github.sha }}"
