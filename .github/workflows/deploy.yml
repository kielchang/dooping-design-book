name: Deploy Design Book

# main＝其他系統參照的規範正本。這支把它發佈到 gh-pages 分支的根目錄：
#   /            → 文件站（Docusaurus）
#   /storybook/  → Storybook 活元件展示
#   /r/*.json    → shadcn registry（npx shadcn add <URL> 可安裝）
#
# gh-pages 上還有一個 /preview/，那是 dev 的預覽站（由 ci.yml 部署）。
# 這支只動根目錄、絕不碰 preview/，反之亦然——邊界寫在 scripts/deploy-gh-pages.sh。
# 兩支共用 concurrency group「gh-pages-write」序列化寫入，避免同時 push 互撞。
#
# 三個產物互相依賴（文件站與 Storybook 都吃元件原始碼、registry 由原始碼產生），
# 所以刻意放在同一個 job 依序建置，避免版本不一致。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 推 gh-pages 分支

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - run: npm ci
      - name: 建置 token（CSS 產物是後續所有步驟的前提）
        run: npm run build:tokens
      - name: 型別檢查
        run: npm run typecheck
      - name: 守衛測試（元件庫邊界、token 一致性、去領域化詞彙）
        run: npm test

      - name: 產生 registry JSON（base 指向正式站）
        run: node scripts/build-registry.mjs
        env:
          REGISTRY_BASE: https://kielchang.github.io/dooping-design-book

      - name: 建置文件站
        working-directory: book
        run: |
          npm ci
          npm run build
        env:
          BOOK_BASE_URL: /dooping-design-book/
          BOOK_SITE_URL: https://kielchang.github.io

      - name: 建置 Storybook → /storybook
        run: npm run build-storybook -- -o book/build/storybook

      - name: 放置 registry → /r
        run: |
          mkdir -p book/build/r
          cp registry/*.json book/build/r/

      - name: 發佈到 gh-pages 根目錄（保留 preview/）
        run: |
          bash scripts/deploy-gh-pages.sh book/build . "deploy(main) ${{ github.sha }}"

      # 規範版號 tag（vX.Y.Z）——給取用端的訊號，不是部署紀錄。
      #
      # 版號正本是根目錄 package.json 的 version：工程師在 dev 依大中小判準 bump
      # 並寫 CHANGELOG（提議），使用者在 dev → main 的 PR 上確認（合併＝確認），
      # 這裡只負責把已確認的版號蓋成 tag。版號沒動的進版（純文件）不產生新 tag——
      # 取用端看不到新版號，就代表不需要動作。日期在 tag 描述裡，不佔名稱。
      #
      # 這個 tag 不觸發任何東西：v* 不符合 publish-tokens.yml 的 tokens-v* 比對，
      # 而且 GITHUB_TOKEN 建立的 ref 依 GitHub 防遞迴機制不會觸發其他 workflow。
      # npm 發佈仍然只有人工的 tokens-v* 或 workflow_dispatch 那兩條路。
      - name: 蓋上規範版號 tag（vX.Y.Z）
        run: |
          git fetch --tags -q origin
          TAG="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG 已存在——版號未變的進版（純文件）或重跑，都不另打 tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tag 訊息帶上配對的 tokens 版本——「這一版規範配哪一版 token」從此
          # 可以直接從 git tag 稽核（git tag -n），不必翻 CHANGELOG。
          TOKENS_VER=$(jq -r '.dependencies["@dooping/tokens"]' packages/react/package.json | sed 's/^[~^>=< ]*//')
          git tag -a "$TAG" -m "進版 $TAG（$(TZ=Asia/Taipei date +%F)）" \
            -m "tokens 配對版：$TOKENS_VER" \
            -m "commit ${{ github.sha }}" \
            -m "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$TAG"
          echo "### 🏷 $TAG（tokens 配對版 $TOKENS_VER）" >> "$GITHUB_STEP_SUMMARY"

      # 進版當下的配對狀態。ci.yml 的漂移警告只跑在 dev push／PR——
      # 但「該去推 tokens-v* 了」這件事最該被看見的時刻是**進版成功的這一刻**。
      # 永遠 exit 0：這是提示，不是閘門（發佈本來就是合併之後的下一步）。
      - name: 配對狀態（宣告版 vs npm，僅提示）
        continue-on-error: true
        run: |
          DECLARED=$(jq -r '.dependencies["@dooping/tokens"] // empty' packages/react/package.json | sed 's/^[~^>=< ]*//')
          PUBLISHED=$(npm view @dooping/tokens version 2>/dev/null || true)
          {
            echo "### @dooping/tokens 配對狀態"
            echo ""
            echo "| 宣告（本次進版） | npm latest |"
            echo "| --- | --- |"
            echo "| \`${DECLARED:-查不到}\` | \`${PUBLISHED:-查不到}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DECLARED" ] && [ -n "$PUBLISHED" ] && [ "$DECLARED" != "$PUBLISHED" ]; then
            {
              echo "⚠️ **npm 還沒有 \`$DECLARED\`。** 這次進版包含 token 變更的話，現在就是發佈的時刻："
              echo ""
              echo '```bash'
              echo "git tag -a tokens-v$DECLARED -m \"tokens $DECLARED\" && git push origin tokens-v$DECLARED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::npm 上的 @dooping/tokens 是 $PUBLISHED，本次進版宣告 $DECLARED——請推 tokens-v$DECLARED 發佈。"
          else
            echo "✅ 配對一致。" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
