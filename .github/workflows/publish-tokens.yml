name: Publish tokens

# 只發佈 @dooping/tokens —— 三層裡唯一該進 npm 的一層。
#
# 元件不發套件（走 registry 複製原始碼），
# 所以這條流水線刻意只認 packages/tokens 一個 workspace。
#
# 認證走 npm Trusted Publishing（OIDC）：npm 信任「這個 repo 的這支 workflow」，
# 每次執行當場換發一組短效憑證，repo 裡不存任何長期 token。
# 這是 npm 官方對 CI 的建議做法——classic token 的「bypass 2FA」選項等於把一把
# 能繞過雙因素的長期鑰匙放進 secret 裡，外洩就等於帳號被接管。
#
# ── npm 端一次性設定 ──────────────────────────────────────────
#   套件頁 → Settings → Trusted publishing → 新增 GitHub Actions：
#     Organization or user:  kielchang
#     Repository:            dooping-design-book
#     Workflow filename:     publish-tokens.yml     ← 必須與本檔名一致
#
#   注意：npm 目前要求「套件已存在」才能在套件頁設定 trusted publisher。
#   若 @dooping 組織的 Settings → Trusted Publishers 可以先替未發佈的套件設定，
#   就走那條、完全不需要 token；否則第一次發佈需要一枚一次性的 granular token
#   （見下方 NPM_TOKEN 後備），發完立刻撤銷並改用 OIDC。
# ─────────────────────────────────────────────────────────────
#
# 兩種觸發：
#   workflow_dispatch  → 手動，預設是「試跑」，確認 tarball 內容用
#   tag tokens-v*      → 真的發佈（例：git tag tokens-v0.1.0 && git push --tags）
#
# 發佈前一定重跑守衛：token 是契約，發壞了每個宿主都會痛。
#
# 兩個 job，發佈身分只在後一個：
#   build    唯讀、沒有 id-token：配對檢查、npm ci、建置、型別、守衛，打出 tarball 交給 publish。
#            專案程式與相依套件的安裝腳本只在這裡跑——這裡拿不到發佈身分。
#   publish  只有 tag 觸發或手動非試跑才跑；有 id-token，但不簽出、不跑 npm ci 與任何專案腳本，
#            只把 build 打好的 tarball 送上 npm（發 tarball 不跑 prepublishOnly）。
#   試跑整個不碰 publish job，發佈身分完全不出現。
#   publish 掛 environment: npm-publish——在 GitHub Settings → Environments 把它的部署規則限定在
#   tokens-v* tag，並在 npm 的 trusted publisher 填上這個 environment，發佈身分就綁死在核准流程。
#   守衛：tests/workflow-contract.test.ts。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試跑（不真的發佈，只印出會送出什麼）"
        type: boolean
        default: true
  push:
    tags: ["tokens-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 配對檢查要驗「tag 指向的 commit 在不在 main 上」——
          # 預設的淺層簽出（depth 1）會讓 merge-base 誤判，這個 repo 很小，抓全歷史。
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # 配對硬閘：tag 觸發、以及手動觸發但不是試跑的時候都要過（試跑不發佈，不適用）。
      #
      # 三條規則，各擋一種真實的出錯方式：
      #
      # 1. tag 名必須等於 packages/tokens/package.json 的 version。
      #    tag 名只是「觸發器」，npm publish 實際讀的是 package.json——
      #    推 tokens-v0.7.0 到一個 package.json 還是 0.6.0 的 commit，
      #    會發出 0.6.0 而所有人以為發了 0.7.0。配對從 tag 那一刻就是錯的。
      # 2. 發佈的 commit 必須在 main（核准版）上。
      #    對著 dev、staging 或任意分支的 commit 打 tag 一樣會觸發發佈，發出去的是還沒核准的內容。
      # 3. 手動發佈只能對 main 執行。以前手動觸發且取消試跑時整個閘都不跑，等於從任何分支都能發。
      #
      # 條件寫成 !inputs.dry_run，不寫 inputs.dry_run == false：push 事件沒有 inputs，
      # GitHub 的寬鬆比較下 null == false 為真——兩者在 push 時結果相同，但前者的意思才是對的。
      - name: 配對檢查（tag 名＝版本、commit 在 main 上）
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          PKG_VER=$(node -p "require('./packages/tokens/package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="${GITHUB_REF#refs/tags/tokens-v}"
            if [ "$TAG_VER" != "$PKG_VER" ]; then
              echo "::error::tag 是 tokens-v$TAG_VER，但 packages/tokens/package.json 是 $PKG_VER——npm 會發出 $PKG_VER，配對就錯了。修法：刪掉這個 tag，對「版號已經是 $TAG_VER 的 main commit」重新打。"
              exit 1
            fi
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::手動發佈只能對 main 執行（收到 $GITHUB_REF）——發佈只能來自核准版。"
            exit 1
          fi
          # tag 觸發的簽出只帶那個 tag 的 ref，origin/main 不存在——明確抓下來；抓不到就失敗。
          git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::要發佈的 commit 不在 main 上。發佈只能來自核准版——請先走 dev → staging → main，再對 main 上的 commit 打 tokens-v$PKG_VER。"
            exit 1
          fi
          echo "::notice::配對檢查通過：@dooping/tokens $PKG_VER，commit 在 main 上。"

      - run: npm ci
      - name: 建置 token（CSS 產物是後續所有步驟的前提）
        run: npm run build:tokens
      - name: 型別檢查
        run: npm run typecheck
      - name: 守衛測試
        run: npm test

      # 打包在這裡做完：publish job 只送出這個檔，不再建置。build:tokens 已經產出 dist，
      # npm pack 不跑 prepublishOnly，所以打進去的就是上面守衛驗過的那一份。
      - name: 打包 tarball
        run: |
          mkdir -p pack
          npm pack --workspace @dooping/tokens --pack-destination pack
          ls pack/*.tgz
          tar -tzf pack/*.tgz
      - name: 試跑：列出會送出的內容（不發佈）
        if: github.event_name != 'push' && inputs.dry_run
        run: |
          echo "::notice::試跑模式 —— 不會真的發佈，publish job 不會執行"
          npm publish pack/*.tgz --dry-run
      - name: 交出 tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokens-tarball
          path: pack/*.tgz
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC：trusted publishing 與 provenance 都靠這個
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 內建的 npm 是 10.x，不支援 OIDC。
      # Trusted publishing 需要 npm >= 11.5.1，所以這一步不能省；釘死版號，不裝 latest。
      - name: 升級 npm（trusted publishing 需要 >= 11.5.1）
        run: |
          npm install -g npm@11.19.0
          echo "npm $(npm -v)"

      - name: 取回 build 的 tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tokens-tarball
          path: pack

      # 認證優先序由 npm CLI 決定：偵測得到 OIDC 就用 OIDC，
      # 偵測不到才回頭吃 NODE_AUTH_TOKEN。所以 NPM_TOKEN secret 是選用的——
      # 沒設就是純 trusted publishing，設了則作為第一次發佈的後備。
      #
      # 不需要 --provenance：trusted publishing 會自動產生並附上 provenance。
      - name: 發佈
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::偵測到 NPM_TOKEN。OIDC 可用時會優先使用；若這次是靠 token 發佈成功，請在 npm 設好 trusted publisher 後撤銷此 token。"
          else
            echo "::notice::未設 NPM_TOKEN —— 走 trusted publishing（OIDC）。"
          fi
          npm publish pack/*.tgz --access public
