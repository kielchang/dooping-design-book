name: Publish tokens

# 只發佈 @dooping/tokens —— 三層裡唯一該進 npm 的一層。
#
# 元件不發套件（ADR-0004：元件一定會被改，走 registry 複製原始碼），
# 所以這條流水線刻意只認 packages/tokens 一個 workspace。
#
# 認證走 npm Trusted Publishing（OIDC）：npm 信任「這個 repo 的這支 workflow」，
# 每次執行當場換發一組短效憑證，repo 裡不存任何長期 token。
# 這是 npm 官方對 CI 的建議做法——classic token 的「bypass 2FA」選項等於把一把
# 能繞過雙因素的長期鑰匙放進 secret 裡，外洩就等於帳號被接管。
#
# ── npm 端一次性設定 ──────────────────────────────────────────
#   套件頁 → Settings → Trusted publishing → 新增 GitHub Actions：
#     Organization or user:  kielchang
#     Repository:            dooping-design-book
#     Workflow filename:     publish-tokens.yml     ← 必須與本檔名一致
#
#   注意：npm 目前要求「套件已存在」才能在套件頁設定 trusted publisher。
#   若 @dooping 組織的 Settings → Trusted Publishers 可以先替未發佈的套件設定，
#   就走那條、完全不需要 token；否則第一次發佈需要一枚一次性的 granular token
#   （見下方 NPM_TOKEN 後備），發完立刻撤銷並改用 OIDC。
# ─────────────────────────────────────────────────────────────
#
# 兩種觸發：
#   workflow_dispatch  → 手動，預設是「試跑」，確認 tarball 內容用
#   tag tokens-v*      → 真的發佈（例：git tag tokens-v0.1.0 && git push --tags）
#
# 發佈前一定重跑守衛：token 是契約，發壞了每個宿主都會痛。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試跑（不真的發佈，只印出會送出什麼）"
        type: boolean
        default: true
  push:
    tags: ["tokens-v*"]

permissions:
  contents: read
  id-token: write # OIDC：trusted publishing 與 provenance 都靠這個

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 配對檢查要驗「tag 指向的 commit 在不在 main 上」——
          # 預設的淺層簽出（depth 1）會讓 merge-base 誤判，這個 repo 很小，抓全歷史。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 內建的 npm 是 10.x，不支援 OIDC。
      # Trusted publishing 需要 npm >= 11.5.1，所以這一步不能省。
      - name: 升級 npm（trusted publishing 需要 >= 11.5.1）
        run: |
          npm install -g npm@latest
          echo "npm $(npm -v) / node $(node -v)"

      # 配對硬閘（只在 tag 觸發時跑；workflow_dispatch 的試跑不適用）。
      #
      # 兩條規則，各擋一種真實的出錯方式：
      #
      # 1. tag 名必須等於 packages/tokens/package.json 的 version。
      #    tag 名只是「觸發器」，npm publish 實際讀的是 package.json——
      #    推 tokens-v0.7.0 到一個 package.json 還是 0.6.0 的 commit，
      #    會發出 0.6.0 而所有人以為發了 0.7.0。配對從 tag 那一刻就是錯的。
      # 2. tag 指向的 commit 必須在 main 上。
      #    「先合併進 main、再發佈」原本只是紀律——對著 dev 或任意分支的
      #    commit 打 tag 一樣會觸發發佈，發出去的是沒經過進版確認的內容。
      #    這一步把紀律變成機器規則。
      - name: 配對檢查（tag 名＝版本、commit 在 main 上）
        if: startsWith(github.ref, 'refs/tags/tokens-v')
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/tokens-v}"
          PKG_VER=$(node -p "require('./packages/tokens/package.json').version")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag 是 tokens-v$TAG_VER，但 packages/tokens/package.json 是 $PKG_VER——npm 會發出 $PKG_VER，配對就錯了。修法：刪掉這個 tag，對「版號已經是 $TAG_VER 的 main commit」重新打。"
            exit 1
          fi
          # tag 觸發的簽出只帶那個 tag 的 ref，origin/main 不存在——明確抓下來。
          git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::這個 tag 指向的 commit 不在 main 上。發佈只能來自進版確認過的內容——請先把變更合併進 main，再對 main 上的 commit 打 tokens-v$TAG_VER。"
            exit 1
          fi
          echo "::notice::配對檢查通過：tokens-v$TAG_VER = package.json $PKG_VER，commit 在 main 上。"

      - run: npm ci
      - name: 建置 token（CSS 產物是後續所有步驟的前提）
        run: npm run build:tokens
      - name: 型別檢查
        run: npm run typecheck
      - name: 守衛測試
        run: npm test

      # 認證優先序由 npm CLI 決定：偵測得到 OIDC 就用 OIDC，
      # 偵測不到才回頭吃 NODE_AUTH_TOKEN。所以 NPM_TOKEN secret 是選用的——
      # 沒設就是純 trusted publishing，設了則作為第一次發佈的後備。
      #
      # 不需要 --provenance：trusted publishing 會自動產生並附上 provenance。
      - name: 發佈
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::偵測到 NPM_TOKEN。OIDC 可用時會優先使用；若這次是靠 token 發佈成功，請在 npm 設好 trusted publisher 後撤銷此 token。"
          else
            echo "::notice::未設 NPM_TOKEN —— 走 trusted publishing（OIDC）。"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::試跑模式 —— 不會真的發佈"
            npm publish --workspace @dooping/tokens --dry-run
          else
            npm publish --workspace @dooping/tokens
          fi
